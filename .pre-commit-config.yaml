# Pre-commit hooks for Bifrost
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Ruff - Python linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Secret scanning
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: |
          (?x)^(
            .*\.lock$|
            .*\.json$|
            package-lock\.json$
          )$

  # Pytest - run fast unit tests only (exclude slow and integration tests)
  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest-fast
        entry: pytest
        language: system
        types: [python]
        args: ["-m", "not slow and not integration", "--tb=short"]
        pass_filenames: false
        always_run: true
